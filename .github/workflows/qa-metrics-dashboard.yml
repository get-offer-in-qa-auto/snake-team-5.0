name: QA Metrics Dashboard

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Positive number of UTC calendar days in the rolling window
        required: true
        default: "7"
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish-dashboard:
    name: Publish rolling QA metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}quality/
    env:
      METRICS_DAYS: ${{ inputs.days || vars.QA_METRICS_DAYS || '7' }}
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate metrics period
        shell: bash
        run: |
          if [[ ! "$METRICS_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Metrics period must be a positive integer; got: $METRICS_DAYS" >&2
            exit 1
          fi

      - name: Read completed regression runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          since="$(date -u -d "$((METRICS_DAYS - 1)) days ago" +%Y-%m-%dT00:00:00Z)"
          gh api --paginate --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/teamcity-regression.yml/runs" \
            -f status=completed \
            -f created=">=${since}" \
            -f per_page=100 \
            --jq '.workflow_runs[]' |
            jq --slurp '.' > workflow-runs.json

      - name: Read regression test-stage durations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS= read -r run_id; do
            duration="$(
              gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                --jq '.jobs[]' |
                jq --slurp '
                  [
                    .[]
                    | select(
                        .name == "TeamCity API regression"
                        or (.name | startswith("TeamCity UI"))
                      )
                    | select(.started_at != null and .completed_at != null)
                  ]
                  | if length == 0 then null
                    else
                      (
                        (map(.completed_at | fromdateiso8601) | max)
                        - (map(.started_at | fromdateiso8601) | min)
                      )
                    end
                '
            )"
            if [ "$duration" = "null" ]; then
              continue
            fi
            updated_file="$(mktemp)"
            jq \
              --argjson run_id "$run_id" \
              --argjson duration "$duration" \
              'map(
                if .id == $run_id
                then . + {test_duration_seconds: $duration}
                else .
                end
              )' \
              workflow-runs.json > "$updated_file"
            mv "$updated_file" workflow-runs.json
          done < <(jq -r '.[].id' workflow-runs.json)

      - name: Prepare persistent Pages site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir pages-site
          git init pages-site
          cd pages-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi

      - name: Build QA metrics dashboard
        id: dashboard
        shell: bash
        run: |
          quality_snapshot="quality/periods/${METRICS_DAYS}"

          python3 scripts/build_coverage_dashboard.py \
            --site-dir pages-site \
            --destination quality/coverage \
            --quality-url "../"
          python3 scripts/build_quality_dashboard.py \
            --site-dir pages-site \
            --runs-json workflow-runs.json \
            --days "${METRICS_DAYS}" \
            --destination "$quality_snapshot" \
            --coverage-metrics quality/coverage/metrics.json \
            --coverage-url "../../coverage/"
          python3 scripts/build_quality_dashboard.py \
            --site-dir pages-site \
            --runs-json workflow-runs.json \
            --days "${METRICS_DAYS}" \
            --destination quality \
            --coverage-metrics quality/coverage/metrics.json \
            --coverage-url "coverage/"
          python3 .github/scripts/refresh_allure_indexes.py --site-dir pages-site
          touch pages-site/.nojekyll

      - name: Commit dashboard to Pages history
        shell: bash
        run: |
          cd pages-site
          git add quality index.html reports/index.html reports/*/index.html .nojekyll
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Update ${METRICS_DAYS}-day QA metrics dashboard"
            git push origin HEAD:gh-pages
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: pages-site
          retention-days: 7

      - name: Deploy QA metrics dashboard
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Add dashboard to workflow summary
        shell: bash
        run: |
          {
            cat pages-site/quality/report.md
            echo
            echo "## Full published report"
            echo
            echo "- [Open current QA metrics report](${{ steps.deployment.outputs.page_url }}quality/)"
            echo "- [Open saved ${METRICS_DAYS}-day snapshot](${{ steps.deployment.outputs.page_url }}quality/periods/${METRICS_DAYS}/)"
            echo "- [Open API framework coverage](${{ steps.deployment.outputs.page_url }}quality/coverage/)"
          } >> "$GITHUB_STEP_SUMMARY"
